version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terratwin-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./terratwin.db
      - JWT_SECRET_KEY=terratwin_secret_encryption_key_2026_super_secure
    volumes:
      - ./backend:/app
      - backend-db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terratwin-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
