<body class="flex items-center justify-center min-h-screen nature-bg p-margin-mobile md:p-0">
<!-- Login Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl p-xl card-elevation border border-outline-variant/30">
<!-- Brand Header -->
<div class="flex flex-col items-center text-center mb-xl">
<div class="w-16 h-16 mb-md">
<img alt="AgriVision AI Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs8AJZDTWCKbOzF2oeiO7Rxft2jCPshuWtpDJPK8N2SOC1FrKoHLWl9nnMeuOJLCgeQM0UsajzPNH8iaBjUS7pOrQK3CKoL7yy5iWSQEsiLN7hvdvGEDA7SE2YyMk4_dX2x3MGry1vujAjaHOL9QSynXdgO7TBFru9hipHo5ozkp443Ok3kCnoq3FJqbz56Is8HXCjsh5zExc5sU9tuPGjD5qEuzojli-WQ5u02yfpOks4orFfA53N2h6E"/>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">
                Welcome back
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Sign in to your agriculture intelligence dashboard
            </p>
</div>
<!-- Authentication Form -->
<form action="#" class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<input class="w-full px-md py-sm bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-lg transition-all font-body-md text-body-md outline-none" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">Password</label>
<div class="relative">
<input class="w-full px-md py-sm bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-lg transition-all font-body-md text-body-md outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-5 h-5 border-2 border-outline rounded focus:ring-offset-0 focus:ring-0 checked:bg-primary checked:border-primary transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface-variant group-hover:text-primary transition-colors">Remember me</span>
</label>
<a class="font-label-lg text-label-lg text-primary hover:text-secondary transition-colors font-semibold" href="#">Forgot password?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-xl font-label-lg text-label-lg hover:bg-secondary active:scale-[0.98] transition-all flex justify-center items-center gap-sm shadow-md" type="submit">
                Sign In
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-xl gap-md">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">or continue with</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>

<p class="mt-xl text-center font-body-md text-body-md text-on-surface-variant">

</p>

<!-- Interactive Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.classList.add('scale-[1.01]');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.classList.remove('scale-[1.01]');
                });
            });

            // Prevent default form submission for demo
            document.querySelector('form').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalContent = btn.innerHTML;
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> Signing in...`;
                btn.classList.add('opacity-80');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('opacity-80');
                    alert('Demo Login Successful');
                }, 1500);
            });
        });
    </script>
